# Render blueprint. Free web services sleep after ~15 min idle and have 512 MB RAM, so query embeddings are served
# by an API (same BGE model as the stored vectors) instead of a local ONNX model. Secrets use `sync: false`:
# they are entered in the Render dashboard and never committed.
services:
  - type: web
    name: ai-investigation-engine
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - { key: APP_ENV, value: production }
      - { key: ADMIN_API_KEY, sync: false }
      - { key: QDRANT_URL, sync: false }
      - { key: QDRANT_API_KEY, sync: false }
      - { key: LLM_PROVIDER, value: openai }
      - { key: LLM_BASE_URL, value: "https://api.groq.com/openai/v1" }
      - { key: LLM_MODEL, value: openai/gpt-oss-120b }
      - { key: LLM_API_KEY, sync: false }
      - { key: EMBEDDING_PROVIDER, value: openai }
      - { key: EMBEDDING_BASE_URL, value: "https://router.huggingface.co/hf-inference/v1" }
      - { key: EMBEDDING_MODEL, value: BAAI/bge-small-en-v1.5 }
      - { key: EMBEDDING_DIM, value: "384" }
      - { key: EMBEDDING_STORE_ID, value: "fastembed:BAAI/bge-small-en-v1.5" }
      - { key: EMBEDDING_API_KEY, sync: false }
