name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # fully offline stack: no secrets, no network models needed
      EMBEDDING_PROVIDER: hashing
      LLM_PROVIDER: heuristic
      QDRANT_PATH: ":memory:"
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
